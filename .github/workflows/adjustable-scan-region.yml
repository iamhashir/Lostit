name: Apply adjustable scanner region

on:
  push:
    paths:
      - 'scripts/patch-adjustable-scan-region.py'
      - '.github/workflows/adjustable-scan-region.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scanner patch
        run: python scripts/patch-adjustable-scan-region.py
      - name: Verify TypeScript
        run: |
          npm ci
          npm run typecheck
      - name: Commit scanner changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/portion-scanner src/PortionScannerEntry.tsx
          git commit -m 'Add adjustable ARCore scan region'
          git push origin main
