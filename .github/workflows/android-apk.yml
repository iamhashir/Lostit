name: Build Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate optimized Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MealTrack-arm64-release.apk
          ls -lh MealTrack-arm64-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MealTrack-Android-Release-APK
          path: MealTrack-arm64-release.apk
          if-no-files-found: error
          retention-days: 30
