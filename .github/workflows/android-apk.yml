name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Enable release optimizations
        run: |
          cat >> android/gradle.properties <<'EOF'
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          android.enableBundleCompression=true
          reactNativeArchitectures=arm64-v8a
          EOF

      - name: Build optimized release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Lostit-arm64-release.apk
          ls -lh Lostit-arm64-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lostit-Android-Release-APK
          path: Lostit-arm64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest Lostit-arm64-release.apk \
            --title "Latest Android Release APK" \
            --notes "Production-optimized ARM64 release build from commit ${GITHUB_SHA}. R8 minification, resource shrinking and bundle compression are enabled." \
            --prerelease \
            --target "${GITHUB_SHA}"
