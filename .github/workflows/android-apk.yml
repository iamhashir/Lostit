name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate portion scanner entry
        run: node scripts/integrate-portion-scanner.mjs

      - name: Persist portion scanner integration
        run: |
          if ! git diff --quiet -- App.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add App.tsx
            git commit -m "Integrate ARCore portion scanner entry"
            git push
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check app
        run: npm run typecheck

      - name: Generate optimized Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Verify release optimization config
        run: |
          grep -E 'android.enable(Minify|ShrinkResources)InReleaseBuilds|android.enableBundleCompression' android/gradle.properties

      - name: Verify ARCore module autolinking
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -R "PortionScannerModule" android modules/portion-scanner >/dev/null

      - name: Build ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MealTrack-arm64-release.apk
          ls -lh MealTrack-arm64-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MealTrack-Android-Release-APK
          path: MealTrack-arm64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest MealTrack-arm64-release.apk \
            --title "Latest MealTrack Android APK" \
            --notes "Optimized ARM64 release build from commit ${GITHUB_SHA}. ARCore portion-scanner foundation included." \
            --prerelease \
            --target "${GITHUB_SHA}"
