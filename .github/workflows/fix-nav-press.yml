name: Fix bottom nav press animation

on:
  push:
    paths:
      - 'scripts/fix-bottom-nav-press.py'
      - '.github/workflows/fix-nav-press.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply nav fix
        run: python scripts/fix-bottom-nav-press.py

      - name: Verify TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Commit nav fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx
          git commit -m 'Fix bottom nav double-tap lag and press scale'
          git push origin main
